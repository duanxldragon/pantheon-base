name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**
      - fix/**
      - feat/**
      - feature/**
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION_FILE: backend/go.mod
  NODE_VERSION: "24"

jobs:
  # ============================================================
  # Phase 1: Fast Checks (< 2 min)
  # ============================================================
  fast-checks:
    name: Fast Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Check Go formatting
        id: gofmt
        continue-on-error: true
        working-directory: backend
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted Go files:"
            echo "$UNFORMATTED"
            exit 1
          fi
          echo "Go formatting OK"

      - name: Enforce formatting gate
        shell: bash
        env:
          GOFMT_RESULT: ${{ steps.gofmt.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          echo "gofmt: $GOFMT_RESULT"
          # PR/merge_group: report-only
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; then
            echo "Go formatting is report-only for PR/merge_group"
            exit 0
          fi
          if [ "$GOFMT_RESULT" != "success" ]; then
            exit 1
          fi

      - name: Check Go vet
        working-directory: backend
        run: go vet ./...

      - name: Install frontend deps
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run patch:arco-react19

      - name: TypeScript type check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: ESLint check
        working-directory: frontend
        run: ./node_modules/.bin/eslint src --max-warnings 0

  # ============================================================
  # Phase 2: Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # timeout raised 10 -> 20: DB-backed tests (MySQL/Redis services) run real
    # migrations per test database (coverage reconciliation, 2026-09-10).
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      mysql:
        image: mysql:8.0
        env:
          # Per-run random password: no literal credential in code (secrets:S6697).
          # Container env expansion resolves it in health-cmd; the job env below
          # recomputes the identical value for the test DSN.
          MYSQL_ROOT_PASSWORD: pw-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_DATABASE: pantheon_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # S3 runtime probe (tenant verification gap #5): the env-gated
      # TestServiceStoreUsesRealS3WhenConfigured round-trip runs for real when
      # this service is up. No --health-cmd: recent minio images ship no curl
      # and probe mechanics vary, so readiness is awaited runner-side below
      # via the unauthenticated /minio/health/live endpoint.
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env:
          MINIO_ROOT_USER: pantheon-minio-ci
          MINIO_ROOT_PASSWORD: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 9000:9000

    env:
      PANTHEON_TEST_DSN: root:pw-${{ github.run_id }}-${{ github.run_attempt }}@tcp(127.0.0.1:3306)/pantheon_test?charset=utf8mb4&parseTime=true&loc=Local
      PANTHEON_TEST_REDIS_ADDR: 127.0.0.1:6379
      PANTHEON_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PANTHEON_TEST_S3_ACCESS_KEY: pantheon-minio-ci
      PANTHEON_TEST_S3_SECRET_KEY: minio-ci-${{ github.run_id }}-${{ github.run_attempt }}
      PANTHEON_TEST_S3_REGION: us-east-1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # MinIO has no reliable in-image health check; wait runner-side before
      # any test touches it (S3 round-trip probe).
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO is live"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO failed to become healthy"
          exit 1

      # Coverage reconciliation (task 0, 2026-09-10): the unit-tests job now runs
      # with MySQL + Redis services so the gate measures the same DB-backed path
      # as local evidence. Keep -short: testmysql.Open creates an isolated
      # database per test and skips cleanly when the DSN is absent.
      - name: Run Go tests with coverage
        working-directory: backend
        run: go test -race -short -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Go coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: go-coverage
          path: backend/coverage.out
          retention-days: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Run npm script tests
        run: |
          npm ci --ignore-scripts
          npm run test:docs-frontmatter
          npm run test:foundation-release
          npm run test:release-gate-workflow

  # ============================================================
  # Phase 2b: Frontend Unit Tests (Vitest + coverage)
  # ============================================================
  frontend-unit-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts blocks arbitrary lifecycle scripts (supply-chain);
        # the one script we do need (arco react19 patch) runs explicitly below.
        run: |
          npm ci --ignore-scripts
          npm run patch:arco-react19

      - name: Run Vitest with coverage
        working-directory: frontend
        run: npm run test:unit:coverage

      # One API suite launches Chromium to validate browser storage behavior.
      # Keep its browser dependency explicit and scoped to the job that runs it.
      - name: Install Playwright Chromium for API unit tests
        working-directory: frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run tests/api node:test suites
        working-directory: frontend
        run: npm run test:api:unit

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 1

  # ============================================================
  # Phase 3: Lint (golangci-lint)
  # ============================================================
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lint-result: ${{ steps.lint.outcome }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # golangci/golangci-lint-action v9.3.0 replaces the raw `go install
      # pkg@version` run step (SonarCloud githubactions:S8545).
      - name: Run golangci-lint
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.6.2
          working-directory: backend
          args: ./...
          # goinstall: compile v2.6.2 with the repo's Go toolchain, exactly as
          # the previous install path did — the prebuilt binary is built with
          # an older Go and panics type-checking go 1.26.5 sources.
          install-mode: goinstall
          # Parity with the previous go-install path, which never ran
          # `golangci-lint config verify`: .golangci.yml carries three legacy
          # keys the v2 schema rejects (goconst.ignore-tests, issues.exclusions,
          # output.sort-results). Fixing the config changes effective lint
          # behavior — deferred as an explicit follow-up.
          verify: false

      - name: Report full-repo lint result
        if: always()
        shell: bash
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          echo "golangci-lint: $LINT_RESULT"
          # Full-repo lint carries accepted historical debt (see
          # .harness/tasks/2026-07-22-sonarcloud-remediation). The blocking
          # new-code lint gate is in quality.yml for pull_request and
          # merge_group events, using --new-from-rev.
          echo "Full-repo lint is advisory; new-code enforcement lives in quality.yml"
          exit 0

  # ============================================================
  # Phase 3b: Boundary Gate (business/* 边界静态门禁)
  # ============================================================
  boundary-gate:
    name: Boundary Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check business boundaries
        run: node scripts/harness/check-boundaries.mjs --strict --repo pantheon-base

  # ============================================================
  # Phase 3c: Coverage Gate (测试覆盖率门禁，ratchet 起步)
  # ============================================================
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-unit-tests]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download Go coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: go-coverage
          path: backend

      - name: Check Go coverage threshold
        run: |
          # go tool cover needs the module context to resolve package paths
          (cd backend && go tool cover -func=coverage.out > coverage.txt)
          # Threshold aligned to the DB-backed measurement (2026-09-10 coverage
          # reconciliation): measured 55.6% with MySQL/Redis services; gate set
          # at 50 with headroom. See .harness/evidence/2026-09-10-tenant-ready-guardrails/
          node scripts/harness/check-coverage.mjs backend/coverage.txt --threshold ${{ vars.COVERAGE_THRESHOLD || '50' }}

      - name: Download frontend coverage artifact
        id: fe-coverage
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Check frontend coverage threshold
        if: steps.fe-coverage.outcome == 'success'
        run: node scripts/harness/check-coverage.mjs frontend/coverage/coverage-summary.json --format json --threshold ${{ vars.FE_COVERAGE_THRESHOLD || '0' }}

  # ============================================================
  # Phase 4: Summary
  # ============================================================
  ci-summary:
    name: CI Summary
    needs: [fast-checks, unit-tests, frontend-unit-tests, go-lint, boundary-gate, coverage-gate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate summary
        shell: bash
        env:
          FAST_CHECKS: ${{ needs.fast-checks.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          FRONTEND_UNIT_TESTS: ${{ needs.frontend-unit-tests.result }}
          GO_LINT: ${{ needs.go-lint.outputs.lint-result }}
          BOUNDARY_GATE: ${{ needs.boundary-gate.result }}
          COVERAGE_GATE: ${{ needs.coverage-gate.result }}
        run: |
          echo "## CI Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Fast Checks | $FAST_CHECKS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests (Go) | $UNIT_TESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests (Frontend) | $FRONTEND_UNIT_TESTS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Go Lint (full-repo, advisory) | $GO_LINT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Boundary Gate | $BOUNDARY_GATE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage Gate | $COVERAGE_GATE |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$FAST_CHECKS" != "success" ] || \
             [ "$UNIT_TESTS" != "success" ] || \
             [ "$FRONTEND_UNIT_TESTS" != "success" ] || \
             [ "$BOUNDARY_GATE" != "success" ] || \
             [ "$COVERAGE_GATE" != "success" ]; then
            echo "Critical check did not complete successfully"
            exit 1
          fi
