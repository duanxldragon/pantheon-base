name: Release Gate

# Triggered manually before cutting a release tag, or automatically when a
# release/** branch is pushed. This is the single hard checkpoint that must
# pass before `pantheon-base-vX.Y.Z` is tagged and the release bundle is published.
#
# Gate policy (all must pass):
#   1. No open CodeQL error/critical alerts
#   2. No open Dependabot high/critical alerts
#   3. All CI jobs green on the candidate commit
#   4. SonarCloud quality gate green
#   5. No unresolved SonarCloud BUG, VULNERABILITY, or CODE_SMELL issues

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Commit SHA to release (defaults to HEAD of current branch)"
        required: false
        default: ""
  push:
    branches:
      - release/**

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  # ============================================================
  # Candidate: resolve the immutable commit and verify its checks
  # ============================================================
  candidate-checks:
    name: Candidate Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
    steps:
      - name: Resolve candidate commit
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EVENT_CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          requested_sha="${INPUT_CANDIDATE_SHA:-$EVENT_CANDIDATE_SHA}"
          candidate_sha=$(gh api "repos/$REPO/commits/$requested_sha" --jq '.sha')
          if [[ ! "$candidate_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unable to resolve a full candidate commit SHA from $requested_sha."
            exit 1
          fi
          echo "candidate_sha=$candidate_sha" >> "$GITHUB_OUTPUT"
          echo "Candidate commit: $candidate_sha"

      - name: Require successful checks on candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha }}
          REQUIRED_CHECKS: |-
            CI Summary
            Quality Gates
            Security Gates
            Actionlint
            Full Smoke
            SonarCloud Code Analysis
        shell: bash
        run: |
          for attempt in {1..240}; do
            check_runs=$(gh api "repos/$REPO/commits/$CANDIDATE_SHA/check-runs?per_page=100")
            pending=0
            failed=0

            while IFS= read -r check_name; do
              check_result=$(jq -c --arg name "$check_name" \
                '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last // empty' \
                <<< "$check_runs")
              if [ -z "$check_result" ]; then
                echo "Required check $check_name is not present yet."
                pending=1
                continue
              fi

              status=$(jq -r '.status' <<< "$check_result")
              conclusion=$(jq -r '.conclusion // "pending"' <<< "$check_result")
              echo "$check_name: status=$status conclusion=$conclusion"
              if [ "$status" != "completed" ]; then
                pending=1
              elif [ "$conclusion" != "success" ]; then
                failed=1
              fi
            done <<< "$REQUIRED_CHECKS"

            if [ "$failed" -ne 0 ]; then
              echo "::error::A required check failed on $CANDIDATE_SHA."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All required checks passed on $CANDIDATE_SHA."
              exit 0
            fi
            echo "Waiting for candidate checks (attempt $attempt/240)..."
            sleep 30
          done
          echo "::error::Timed out waiting for required checks on $CANDIDATE_SHA."
          exit 1

  # ============================================================
  # Gate 1: CodeQL — zero error/critical open alerts
  # ============================================================
  codeql-alerts:
    name: CodeQL Alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check open CodeQL alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" \
            --jq '[.[] | select(.rule.severity == "error" or .rule.severity == "critical")] | length')
          echo "CodeQL error/critical open alerts: $count"
          if [ "$count" -gt 0 ]; then
            gh api "repos/$REPO/code-scanning/alerts?state=open&tool_name=CodeQL&per_page=100" \
              --jq '.[] | select(.rule.severity == "error" or .rule.severity == "critical") | "  [\(.rule.severity)] \(.rule.id): \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' || true
            echo "::error::Release blocked: $count open CodeQL error/critical alert(s). Fix before releasing."
            exit 1
          fi
          echo "✓ No open CodeQL error/critical alerts"

  # ============================================================
  # Gate 2: Dependabot — zero high/critical open alerts
  # ============================================================
  dependabot-alerts:
    name: Dependabot Alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      actions: read
    steps:
      - name: Check open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GATE_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
            --jq '[.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")] | length')
          echo "Dependabot high/critical open alerts: $count"
          if [ "$count" -gt 0 ]; then
            gh api "repos/$REPO/dependabot/alerts?state=open&per_page=100" \
              --jq '.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical") | "  [\(.security_advisory.severity)] \(.security_advisory.cve_id // .security_advisory.ghsa_id): \(.dependency.package.name)"' || true
            echo "::error::Release blocked: $count open Dependabot high/critical alert(s)."
            exit 1
          fi
          echo "✓ No open Dependabot high/critical alerts"

  # ============================================================
  # Gate 3: SonarCloud — quality gate green + zero open issues
  # ============================================================
  sonarcloud-gate:
    name: SonarCloud Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check SonarCloud quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: duanxldragon_pantheon-base
        run: |
          # Quality gate status (new-code)
          qg=$(curl -sf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=${SONAR_PROJECT}" \
            | jq -r '.projectStatus.status')
          echo "SonarCloud quality gate: $qg"
          if [ "$qg" != "OK" ]; then
            echo "::error::Release blocked: SonarCloud quality gate is $qg (must be OK)."
            exit 1
          fi
          echo "✓ Quality gate OK"

      - name: Check unprocessed SonarCloud issues
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT: duanxldragon_pantheon-base
        run: |
          # The freeze is not releasable while any SonarCloud issue remains open.
          # Every finding must be fixed in code; bulk acceptance is not a release path.
          result=$(curl -sf -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/issues/search?componentKeys=${SONAR_PROJECT}&resolved=false&types=BUG,VULNERABILITY,CODE_SMELL&statuses=OPEN&ps=1")
          total=$(echo "$result" | jq -er '.total | numbers')
          echo "Unprocessed SonarCloud issues (OPEN status): $total"
          if [ "$total" -gt 0 ]; then
            echo "::error::Release blocked: $total unresolved SonarCloud issue(s)."
            exit 1
          fi
          echo "✓ No unresolved SonarCloud issues"

  # ============================================================
  # Gate 4: Open PRs — no unmerged PRs targeting main
  # ============================================================
  open-prs:
    name: Open PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check for open PRs targeting main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" --jq 'length')
          echo "Open PRs targeting main: $count"
          if [ "$count" -gt 0 ]; then
            gh api "repos/$REPO/pulls?state=open&base=main&per_page=100" \
              --jq '.[] | "  #\(.number) \(.title) [\(.head.ref)]"'
            echo "::warning::$count open PR(s) targeting main. Merge or close before releasing."
            # Warning only — maintainer may intentionally release with open PRs
          else
            echo "✓ No open PRs targeting main"
          fi

  # ============================================================
  # Summary
  # ============================================================
  release-gate-summary:
    name: Release Gate Summary
    needs: [candidate-checks, codeql-alerts, dependabot-alerts, sonarcloud-gate, open-prs]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize
        shell: bash
        env:
          CANDIDATE_CHECKS: ${{ needs.candidate-checks.result }}
          CANDIDATE_SHA: ${{ needs.candidate-checks.outputs.candidate_sha }}
          CODEQL: ${{ needs.codeql-alerts.result }}
          DEPENDABOT: ${{ needs.dependabot-alerts.result }}
          SONAR: ${{ needs.sonarcloud-gate.result }}
          OPEN_PRS: ${{ needs.open-prs.result }}
        run: |
          echo "## Release Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate commit: \`$CANDIDATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Candidate required checks | $CANDIDATE_CHECKS |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL (error/critical) | $CODEQL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependabot (high/critical) | $DEPENDABOT |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SonarCloud quality gate and open issues | $SONAR |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Open PRs (advisory) | $OPEN_PRS |" >> "$GITHUB_STEP_SUMMARY"

          if [ "$CANDIDATE_CHECKS" != "success" ] || \
             [ "$CODEQL" != "success" ] || \
             [ "$DEPENDABOT" != "success" ] || \
             [ "$SONAR" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Release blocked.** Fix the failing gates above before tagging." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Release gate failed. See summary for details."
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **All hard gates passed. Safe to tag and publish.**" >> "$GITHUB_STEP_SUMMARY"
          echo "Release gate passed."
