# SonarCloud automatic-analysis scope control.
#
# Excluded from analysis (rationale recorded in
# .harness/tasks/2026-07-25-sonar-scope-and-s8545/manifest.json):
# - scripts/**, frontend/scripts/**: repository tooling, not shipped product
#   code; guarded by its own tests and CI gates.
# - database/**, **/*.sql: DDL/seed/migration files; plsql rules (S1192
#   duplicated-literal etc.) are application-code rules and only produce
#   noise on seed data.
# - frontend/src/i18n/resources/**: translation resource maps; every finding
#   there is a typescript:S2068 hardcoded-credential false positive on
#   translation strings for password-related UI labels. Automatic analysis
#   does not support rule-level ignores, so the files are excluded wholesale.
#
# Product code (backend/**, frontend/src/** minus i18n resources), tests,
# Dockerfile, and .github/workflows remain fully analyzed.
sonar.exclusions=scripts/**,frontend/scripts/**,database/**,**/*.sql,frontend/src/i18n/resources/**
